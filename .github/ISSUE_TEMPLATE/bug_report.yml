name: "Bug Report"
description: "File a bug or issue report to help improve OriginMark"
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible.
        If this is a sensitive security vulnerability, please refer to our [Security Policy](https://github.com/krikera/originmark-platform/security/policy).
  - type: textarea
    id: description
    attributes:
      label: "Describe the bug"
      description: "A clear and concise description of what the bug is."
      placeholder: "When calling /sign with format=c2pa, the manifest export fails because..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "Step-by-step instructions to reproduce the problem."
      placeholder: |
        1. Start the API with `uvicorn main:app`
        2. Send POST request to `/sign` with ...
        3. See error response code 500
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen instead?"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: "Environment Information"
      description: "Operating system, Python version, Node.js version, browser (if applicable)."
      value: |
        - OS: [e.g. Ubuntu 24.04, macOS Sonoma]
        - Python version: [e.g. 3.11.13]
        - Node.js version: [e.g. 20.15.0]
        - Browser / Client: [e.g. Chrome 128, curl]
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: "Additional Context"
      description: "Add any other context, logs, or screenshots about the problem."
    validations:
      required: false
