[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "alembic",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
]
ignore = [
    "E501",  # line length (handled by line-length setting / formatter)
    "B008",  # do not perform function calls in argument defaults (standard for FastAPI Depends)
    "B904",  # raise ... from err (clean error re-raising in API endpoints)
    "E712",  # comparison to True (standard in SQLAlchemy queries: Model.is_active == True)
    "W293",  # blank line contains whitespace
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "E402"]
