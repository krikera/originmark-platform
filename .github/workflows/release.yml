name: Release & Provenance Attestation

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  sign-release:
    name: Generate Hashes, SBOM & Cryptographic Attestations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Source Archive
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix=originmark-${{ github.ref_name }}/ -o dist/originmark-${{ github.ref_name }}.tar.gz HEAD

      - name: Generate Software Bill of Materials (SBOM)
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: dist/sbom.cyclonedx.json

      - name: Generate SHA-256 Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Attest Build Provenance (Sigstore)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

      - name: Upload Release Assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
