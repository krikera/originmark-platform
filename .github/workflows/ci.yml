name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: Backend Tests & Quality (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Static code analysis (ruff)
        run: ruff check .

      - name: Security vulnerability scan (bandit)
        run: bandit -c .bandit.yml -r .

      - name: Dependency vulnerability audit (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Run test suite with pytest
        run: pytest -v

  web-checks:
    name: Frontend Quality & Typecheck (Next.js 16)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability audit (npm audit)
        run: npm audit --audit-level=high

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint code analysis
        run: npm run lint
