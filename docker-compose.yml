services:
  postgres:
    image: postgres:16-alpine
    container_name: originmark-postgres
    restart: always
    environment:
      POSTGRES_USER: originmark
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-originmark_password}
      POSTGRES_DB: originmark_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U originmark -d originmark_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
